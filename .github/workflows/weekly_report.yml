name: Weekly Engineering Market Report

on:
  schedule:
    - cron: "0 5 * * 1" # Maanantaisin klo 05:00 UTC
  workflow_dispatch: {}

concurrency:
  group: ssi-blog-agent-weekly
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e . -r requirements.txt
      # Chunk 0 (current stage): hardcoded question -> DeepSeek -> local .md
      # + Supabase write, no LangGraph yet. Swap this to
      # `python -m ssi_blog_agent.main` once Chunk 3+ has real Layer 3
      # integrations (the LangGraph skeleton is otherwise still all stubs).
      - name: "Chunk 0: DeepSeek + Supabase smoke test"
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/chunk0_smoke_test.py
      - uses: actions/upload-artifact@v4
        with:
          name: chunk0-report
          path: artifacts/*.md
