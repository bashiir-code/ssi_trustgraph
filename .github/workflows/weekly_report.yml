name: Weekly Engineering Market Report

on:
  schedule:
    - cron: "0 5 * * 1" # Maanantaisin klo 05:00 UTC
  workflow_dispatch: {}

concurrency:
  group: ssi-blog-agent-weekly
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e . -r requirements.txt
      # Chunk 1 (current stage): real LangGraph vertical slice — top-voted
      # Supabase question -> DeepSeek triage -> single Tavily research agent
      # -> Forbes-style report -> artifact + Supabase. Grows into the full
      # 5-question swarm in later chunks.
      - name: "Chunk 1: vertical slice (1 question, all 4 layers)"
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: python -m ssi_blog_agent.main
      - uses: actions/upload-artifact@v4
        with:
          name: weekly-report
          path: artifacts/*.md
