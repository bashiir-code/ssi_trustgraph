name: Weekly Engineering Market Report

on:
  schedule:
    - cron: "0 5 * * 1" # Maanantaisin klo 05:00 UTC
  workflow_dispatch: {}

concurrency:
  group: ssi-blog-agent-weekly
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e . -r requirements.txt
      # Real LangGraph pipeline: top-voted Supabase questions -> triage
      # (+retry loop) -> research -> Forbes-style report -> artifact +
      # Supabase. Currently 5 questions (Chunk 2); grows into the swarm
      # (Chunk 3) and matrix jobs (Chunk 6) without changing this step.
      - name: "Run weekly report pipeline"
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: python -m ssi_blog_agent.main
      - uses: actions/upload-artifact@v4
        with:
          name: weekly-report
          path: artifacts/*.md
